name: Generate video
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pillow numpy imageio-ffmpeg
      - name: Generate audio and render video
        run: |
          python audio3.py
          python render3.py
      - name: Commit generated video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add table_de_3_1080x1920.mp4
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "Generate table_de_3_1080x1920.mp4"; git push; fi
      - uses: actions/upload-artifact@v4
        with:
          name: table-de-3-1080x1920
          path: table_de_3_1080x1920.mp4
